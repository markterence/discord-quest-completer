name: Checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
  schedule:
    - cron: "0 0 */2 * *"   # every 2 days at midnight
  workflow_dispatch:

jobs:
  runner-win:
    uses: ./.github/workflows/runner-win.yml

  runner-linux:
    uses: ./.github/workflows/runner-linux.yml

  runner-darwin:
    uses: ./.github/workflows/runner-darwin.yml

  build-win:
    needs: runner-win
    uses: ./.github/workflows/build-win.yml
    secrets: inherit

  build-linux:
    needs: [runner-linux, runner-win]
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  build-darwin:
    needs: runner-darwin
    uses: ./.github/workflows/build-darwin.yml
    secrets: inherit

  publish:
    needs: [build-win, build-linux, build-darwin]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: 'win32-x64'
          - os-name: 'linux-x64'
          - os-name: 'darwin-arm64'
    steps:
      - name: get version
        run: |
          version=$(date +"%Y.%m.%d")
          echo "version=$version" >> $GITHUB_ENV
        shell: bash

      - name: Download artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-${{ matrix.os-name }}-*
          merge-multiple: false

      - name: prepare files
        env:
          version: ${{ env.version }}
          build_release_dir: discord-quest-completer-${{ matrix.os-name }}-${{ env.version }}
          build_debug_dir: discord-quest-completer-${{ matrix.os-name }}-debug-${{ env.version }}
        run: |
          if [ ! -d "tauri-${{ matrix.os-name }}-release" ]; then
            echo "::notice::No artifacts found for ${{ matrix.os-name }}, skipping (build likely failed)"
            exit 0
          fi

          mkdir -p ./build/${{ env.build_release_dir }}
          cp tauri-${{ matrix.os-name }}-release/discord-quest-completer* ./build/${{ env.build_release_dir }}/ 2>/dev/null || true
          cp -r tauri-${{ matrix.os-name }}-release/data/ ./build/${{ env.build_release_dir }}/
          cp -r tauri-${{ matrix.os-name }}-release/resources/ ./build/${{ env.build_release_dir }}/
          zip -r ./build/${{ env.build_release_dir }}.zip ./build/${{ env.build_release_dir }}

          mkdir -p ./build/${{ env.build_debug_dir }}
          cp tauri-${{ matrix.os-name }}-debug/discord-quest-completer* ./build/${{ env.build_debug_dir }}/ 2>/dev/null || true
          cp -r tauri-${{ matrix.os-name }}-debug/data/ ./build/${{ env.build_debug_dir }}/
          cp -r tauri-${{ matrix.os-name }}-debug/resources/ ./build/${{ env.build_debug_dir }}/

          echo "build_release_dir=${{ env.build_release_dir }}" >> $GITHUB_ENV
          echo "build_debug_dir=${{ env.build_debug_dir }}" >> $GITHUB_ENV

      - name: Upload Debug Artifacts
        if: env.build_debug_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.build_debug_dir }}.zip
          retention-days: 3
          path: |
            ./build/${{ env.build_debug_dir }}

      - name: Upload Release Artifacts
        if: env.build_release_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.build_release_dir }}.zip
          retention-days: 3
          path: |
            ./build/${{ env.build_release_dir }}.zip

      - name: Upload Debug Bundles (Artifacts)
        if: env.build_debug_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: bundle-debug-${{ matrix.os-name }}-${{ env.version }}.zip
          retention-days: 3
          path: |
            ./tauri-${{ matrix.os-name }}-debug/bundle/**/*

      - name: Upload Release Bundles (Artifacts)
        if: env.build_release_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: bundle-release-${{ matrix.os-name }}-${{ env.version }}.zip
          retention-days: 3
          path: |
            ./tauri-${{ matrix.os-name }}-release/bundle/**/*
