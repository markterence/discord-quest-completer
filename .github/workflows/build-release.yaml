name: 'publish'

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  runner-win:
    uses: ./.github/workflows/runner-win.yml

  runner-linux:
    uses: ./.github/workflows/runner-linux.yml

  runner-darwin:
    uses: ./.github/workflows/runner-darwin.yml

  build-win:
    needs: runner-win
    uses: ./.github/workflows/build-win.yml
    secrets: inherit

  build-linux:
    needs: [runner-linux, runner-win]
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  build-darwin:
    needs: runner-darwin
    uses: ./.github/workflows/build-darwin.yml
    secrets: inherit

  release:
    needs: [build-win, build-linux, build-darwin]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: get version
        id: extract_version
        run: |
          version=$(date +"%Y.%m.%d")
          echo "version=$version" >> $GITHUB_ENV
        shell: bash

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-win32-x64-release
          path: tauri-win32-x64-release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-linux-x64-release
          path: tauri-linux-x64-release

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-darwin-arm64-release
          path: tauri-darwin-arm64-release

      - name: prepare files
        env:
          version: ${{ env.version }}
          win_build_dir: discord-quest-completer-win32-x64-${{ env.version }}
          linux_build_dir: discord-quest-completer-linux-x64-${{ env.version }}
          darwin_build_dir: discord-quest-completer-darwin-arm64-${{ env.version }}
        run: |
          mkdir -p ./build/${{ env.win_build_dir }}
          cp tauri-win32-x64-release/discord-quest-completer.exe ./build/${{ env.win_build_dir }}/
          cp -r tauri-win32-x64-release/data/ ./build/${{ env.win_build_dir }}/
          cp -r tauri-win32-x64-release/resources/ ./build/${{ env.win_build_dir }}/
          zip -r ./build/${{ env.win_build_dir }}.zip ./build/${{ env.win_build_dir }}

          mkdir -p ./build/${{ env.linux_build_dir }}
          cp tauri-linux-x64-release/discord-quest-completer ./build/${{ env.linux_build_dir }}/
          cp -r tauri-linux-x64-release/data/ ./build/${{ env.linux_build_dir }}/
          cp -r tauri-linux-x64-release/resources/ ./build/${{ env.linux_build_dir }}/
          zip -r ./build/${{ env.linux_build_dir }}.zip ./build/${{ env.linux_build_dir }}

          mkdir -p ./build/${{ env.darwin_build_dir }}
          cp tauri-darwin-arm64-release/discord-quest-completer ./build/${{ env.darwin_build_dir }}/
          cp -r tauri-darwin-arm64-release/data/ ./build/${{ env.darwin_build_dir }}/
          cp -r tauri-darwin-arm64-release/resources/ ./build/${{ env.darwin_build_dir }}/
          zip -r ./build/${{ env.darwin_build_dir }}.zip ./build/${{ env.darwin_build_dir }}

          echo "win_build_dir=${{ env.win_build_dir }}" >> $GITHUB_ENV
          echo "linux_build_dir=${{ env.linux_build_dir }}" >> $GITHUB_ENV
          echo "darwin_build_dir=${{ env.darwin_build_dir }}" >> $GITHUB_ENV

      - name: Create Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles-${{ env.version }}
          path: |
            ./build/${{ env.win_build_dir }}.zip
            ./build/${{ env.linux_build_dir }}.zip
            ./build/${{ env.darwin_build_dir }}.zip
            tauri-win32-x64-release/bundle/**/*
            tauri-linux-x64-release/bundle/**/*
            tauri-darwin-arm64-release/bundle/**/*

      - name: Create and Upload Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          name: Pre-Release ${{ env.version }}
          body: |
            ![GitHub Downloads (specific asset, specific tag)](https://img.shields.io/github/downloads/markterence/discord-quest-completer/${{ env.version }}/${{ env.win_build_dir }}.zip)

            #### Disclaimer
            This tool is intended for educational purposes and personal use. Please respect Discord's terms of service and game publishers' rights when using this application.

            The creators and maintainers of this project are not liable for any damages, account suspensions, or other consequences that may arise from using this software. Use at your own risk. This project is not affiliated with, endorsed by, or connected to Discord in any way.
          append_body: true
          generate_release_notes: true
          files: |
            ./build/${{ env.win_build_dir }}.zip
            ./build/${{ env.linux_build_dir }}.zip
            ./build/${{ env.darwin_build_dir }}.zip
          prerelease: true
          draft: true
        env:
          version: ${{ env.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
